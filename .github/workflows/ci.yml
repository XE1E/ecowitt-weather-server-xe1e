name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint and test Python code
  test-receiver:
    name: Test Receiver
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            receiver/requirements.txt
            receiver/requirements-dev.txt

      # ffmpeg: sin él se saltan las pruebas del timelapse (services/timelapse.py).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          cd receiver
          # Versiones de pytest/ruff FIJADAS en requirements-dev.txt (ver ahí por qué).
          pip install -r requirements-dev.txt mypy

      - name: Lint with Ruff
        run: |
          cd receiver
          ruff check app/

      # Informativo: el código aún no está tipado para mypy. `continue-on-error` en vez
      # del `|| true` de antes, para que el paso salga en amarillo y se vea.
      - name: Type check with MyPy (informativo)
        continue-on-error: true
        run: |
          cd receiver
          mypy app/ --ignore-missing-imports

      # Sin `|| echo` (lo había y dejaba el CI en verde con pruebas rotas).
      - name: Run tests
        run: |
          cd receiver
          pytest tests/ -v

  # Build Docker images
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build receiver image
        uses: docker/build-push-action@v5
        with:
          context: ./receiver
          push: false
          tags: ecowitt-receiver:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build dashboard
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      # `npm ci`: instala exactamente lo de package-lock.json (npm install podía
      # resolver otras versiones que las probadas en local).
      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Lint
        run: |
          cd dashboard
          npm run lint

      - name: Build
        run: |
          cd dashboard
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-build
          path: dashboard/dist/
