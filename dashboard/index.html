<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=5" sizes="any" />
    <link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Estación Clima XE1E en la Ciudad de México — clima en vivo, pronóstico y climatología" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clima XE1E" />
    <title>Estación Clima XE1E</title>
    <!-- Vista previa al compartir (WhatsApp, Facebook, X, Telegram). Sin esto WhatsApp
         tomaba el favicon de 256 px y lo agrandaba: salía borroso. 1200×630 PNG (JPEG emborronaba el logo).
         Las URLs deben ser absolutas; ?v= para forzar que se vuelva a leer si cambia. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Estación Clima XE1E" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="https://clima.xe1e.net/" />
    <meta property="og:title" content="Estación Clima XE1E — clima en vivo en la CDMX" />
    <meta property="og:description" content="Temperatura, lluvia, viento, pronóstico, radar, cámara del cielo y ciclones, en vivo desde Benito Juárez, Ciudad de México." />
    <meta property="og:image" content="https://clima.xe1e.net/og-image.png?v=3" />
    <meta property="og:image:secure_url" content="https://clima.xe1e.net/og-image.png?v=3" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de la Estación Clima XE1E" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Estación Clima XE1E — clima en vivo en la CDMX" />
    <meta name="twitter:description" content="Temperatura, lluvia, viento, pronóstico, radar, cámara del cielo y ciclones, en vivo desde la Ciudad de México." />
    <meta name="twitter:image" content="https://clima.xe1e.net/og-image.png?v=3" />
    <script>
      // Aplica el tema guardado antes de pintar (evita parpadeo)
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
