# Caddy (clima.xe1e.net) termina TLS por delante y le manda a este contenedor
# tráfico HTTP plano -- sin esto, $scheme siempre sería "http" y los redirects
# de abajo mandarían a los usuarios del dominio real a HTTP sin cifrar en vez
# de HTTPS. Caddy sí manda X-Forwarded-Proto por default; el acceso directo a
# la IP:8080 (sin Caddy) no manda ese header, así que cae al $scheme real (http).
map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# IP REAL del cliente que se le pasa al receiver en X-Real-IP (la usan el límite de
# intentos del login y los logs). El puerto 80 (publicado como :8080 a internet, por
# donde empujan las estaciones) usa SIEMPRE la IP de la conexión: un X-Real-IP que
# mande el cliente se pisa. El 81 NO está publicado -- sólo lo alcanza Caddy dentro de
# la red de Docker -- y ahí sí se cree el X-Real-IP que pone Caddy, que a su vez sólo
# confía en el CF-Connecting-IP de las IPs de Cloudflare (ver caddy/Caddyfile). Antes
# /api reenviaba el X-Real-IP del cliente tal cual y el límite del login se saltaba
# inventándolo (2026-09-24).
map $server_port $client_real_ip {
    81      $http_x_real_ip;
    default $remote_addr;
}

server {
    listen 80;
    listen 81;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # La app de la estación vivía en /pro y la raíz era la vista clásica; ahora
    # es al revés (raíz = app completa, /basica = clásica). Redirect permanente
    # para que bookmarks/PWAs instalados/links compartidos con /pro no se
    # queden en blanco -- van al mismo destino sin el prefijo viejo.
    #
    # $http_host (no $host) porque preserva el puerto tal cual lo vio el
    # cliente -- necesario para el acceso directo por IP:8080, y sin puerto
    # de más para el dominio real detrás de Caddy.
    rewrite ^/pro$ $real_scheme://$http_host/ permanent;
    rewrite ^/pro/(.*)$ $real_scheme://$http_host/$1 permanent;

    # Archivos que NO deben cachearse como inmutables (deben revalidarse en cada
    # deploy). El service worker y el manifest son críticos: si se cachean, el
    # sitio se queda "pegado" en una versión vieja. Los match exactos tienen
    # prioridad sobre la regex de estáticos de más abajo.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy.
    #
    # `^~` y no un prefijo pelado: con el prefijo normal, las `location` por REGEX se
    # evalúan igualmente y ganan, así que la regla de estáticos `\.jpg$` de más abajo
    # se tragaba cualquier endpoint acabado en .jpg --p. ej. /api/camera/latest.jpg,
    # que devolvía el 404 del root de nginx aunque la foto existiera--. Con `^~`, si
    # la URL empieza por /api nginx deja de mirar regex.
    #
    # Esto evita ir parcheando caso por caso: /api/display.jpg ya necesitó su propio
    # `location =` exacto por lo mismo (sigue abajo, y sigue ganando por ser exacto).
    # De paso, las respuestas de la API dejan de heredar el `Cache-Control: immutable`
    # de un año de los estáticos, que para una foto que cambia cada cinco minutos era
    # exactamente lo contrario de lo que hace falta.
    location ^~ /api {
        proxy_pass http://receiver:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # IP del cliente para el receiver: `security.client_ip` lee X-Real-IP primero
        # (ver el map de arriba). XFF queda sólo como rastro para los logs.
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Ecowitt push endpoint -> receiver.
    # The WS2910/gateway POSTs weather data here. This MUST be proxied to the
    # receiver; otherwise the SPA fallback below would swallow the POST (return
    # index.html) and the data would be silently lost. Prefix match covers both
    # "/data/report" and "/data/report/".
    location /data/report {
        # El payload Ecowitt es pequeño (~1-2 KB); acotar frena floods de cuerpos
        # grandes. La IP real del cliente se fija en X-Real-IP (no spoofeable aquí).
        client_max_body_size 32k;
        proxy_pass http://receiver:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
    }

    # Health check -> receiver
    location = /health {
        proxy_pass http://receiver:8080/health;
    }

    # Imagen del display kiosco (ESP32-S3), renderizada por el contenedor renderer.
    # Match EXACTO: gana en prioridad sobre la regex de estáticos \.jpg$ de abajo,
    # que si no se tragaría esta ruta y devolvería 404 del root de nginx.
    # El query string (?page=N) se reenvía automáticamente.
    location = /api/display.jpg {
        proxy_pass http://renderer:8090/display.jpg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;   # el primer render (cache frío) puede tardar
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
